name: CI

# Phase 0 — IMPLEMENTATION_PLAN.md: "CI pipeline runs (lint, typecheck, empty
# test suite) green." Also enforces the module-boundary rule from Phase 0's
# Definition of Done (ARCHITECTURE_REVIEW.md §10 item 3 / ADR-001).
#
# Phase 1 adds a real Postgres service: auth.e2e-spec.ts and
# rate-limit.e2e-spec.ts exercise the actual login/refresh/logout/RBAC flow
# against a real database (ARCHITECTURE.md §37's "database constraints" are
# only actually verified by hitting a real Postgres, not by mocking it away).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: exam_sync
          POSTGRES_PASSWORD: exam_sync
          POSTGRES_DB: exam_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://exam_sync:exam_sync@localhost:5432/exam_sync_test?schema=public
      TEST_DATABASE_URL: postgresql://exam_sync:exam_sync@localhost:5432/exam_sync_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (incl. module-boundary check)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        # `prisma migrate deploy` (not `migrate dev`) — CI must apply the
        # already-committed migration history exactly as-is, never generate
        # a new migration or prompt interactively.
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
